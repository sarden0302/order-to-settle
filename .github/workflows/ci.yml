name: CI

# 재구현 중인 저장소의 CI입니다. 지금 컴파일되는 모듈만 검사하고,
# 모듈을 구현해 컴파일이 복구되면 tests 행렬에 추가합니다.
# scripts/test_ci_helpers.py가 소스가 있는 모듈의 누락을 막습니다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - &gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify Python helpers
        run: |
          python3 scripts/test_init_env.py
          python3 -B scripts/test_compose.py
          python3 scripts/test_sync_redis_run_id.py
          python3 scripts/test_pr_body.py
          python3 -B -m unittest discover -s scripts -p 'test_storage_metrics.py'
          python3 -B -m unittest discover -s scripts -p 'test_admission_runner.py'
          python3 -B -m unittest discover -s scripts -p 'test_ci_helpers.py'
          python3 -B scripts/test_kakao_login.py
      # 포맷 검사는 컴파일하지 않으므로 재구현 중인 모듈의 소스도 함께 확인합니다.
      - name: Check Java formatting
        run: ./gradlew --no-daemon --parallel --continue spotlessCheck

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 컴파일이 복구된 모듈을 여기에 추가합니다.
          - group: demo-control
            tasks: ':demo-control:check'
          - group: commerce
            tasks: ':commerce:check :internal-auth:check'
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Compile, Checkstyle and tests
        run: ./gradlew --no-daemon --parallel --continue ${{ matrix.tasks }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.group }}
          path: |
            **/build/reports/checkstyle/
            **/build/reports/tests/
            **/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *java
      - *gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build local demo UI for the control jar
        working-directory: demo-ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package applications
        run: ./gradlew --no-daemon --parallel :demo-control:bootJar

  required-checks:
    if: always()
    needs: [checks, package, tests, demo-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              print('Required checks did not succeed:', failed or 'no results')
              sys.exit(1)
          PY
